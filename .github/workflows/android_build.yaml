name: Stream-Vault Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apk and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build Project with gradle
        run: ./gradlew assembleDebug

      - name: Run Local Tests
        run: ./gradlew test

      - name: Name Stream-Vault APKs
        run: |
          mv app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/Stream-Vault-universal-debug.apk
          mv app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/Stream-Vault-arm64-v8a-debug.apk
          mv app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk app/build/outputs/apk/debug/Stream-Vault-armeabi-v7a-debug.apk
          mv app/build/outputs/apk/debug/app-x86_64-debug.apk app/build/outputs/apk/debug/Stream-Vault-x86_64-debug.apk
          mv app/build/outputs/apk/debug/app-x86-debug.apk app/build/outputs/apk/debug/Stream-Vault-x86-debug.apk

      - name: Lint Checks
        run: ./gradlew ktlintCheck

        # Upload all build artifacts in separate steps. This can be shortened once https://github.com/actions/upload-artifact/pull/354 is merged.
      - name: Upload artifact Stream-Vault-universal-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: Stream-Vault-universal-debug.apk
          path: ./app/build/outputs/apk/debug/Stream-Vault-universal-debug.apk
      - name: Upload artifact Stream-Vault-arm64-v8a-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: Stream-Vault-arm64-v8a-debug.apk
          path: ./app/build/outputs/apk/debug/Stream-Vault-arm64-v8a-debug.apk
      - name: Upload artifact Stream-Vault-armeabi-v7a-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: Stream-Vault-armeabi-v7a-debug.apk
          path: ./app/build/outputs/apk/debug/Stream-Vault-armeabi-v7a-debug.apk
      - name: Upload artifact Stream-Vault-x86_64-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: Stream-Vault-x86_64-debug.apk
          path: ./app/build/outputs/apk/debug/Stream-Vault-x86_64-debug.apk
      - name: Upload artifact Stream-Vault-x86-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: Stream-Vault-x86-debug.apk
          path: ./app/build/outputs/apk/debug/Stream-Vault-x86-debug.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports
